<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبادرة mado وشباب لتوصيل التعليم للجميع - كتابك صدقة</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f0f4f8;
            text-align: center;
            position: relative;
            min-height: 100vh;
        }
        /* خلفية شفافة تحتوي على كتب ومذكرات وأوراق عمل */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            z-index: -1;
            filter: blur(2px);
        }
        header {
            background-color: rgba(44, 122, 123, 0.95);
            color: white;
            padding: 25px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        header .initiative-tag {
            background-color: #e2e8f0;
            color: #2c7a7b;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        header h1 {
            margin: 10px 0 5px 0;
            font-size: 1.8rem;
        }
        header p {
            margin: 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        main {
            max-width: 800px;
            margin: 0 auto;
        }
        section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 20px 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        section h2 {
            font-size: 1.4rem;
            color: #2c7a7b;
            margin-top: 0;
            margin-bottom: 15px;
        }
        form input, form select, form button {
            padding: 12px;
            margin: 6px 0;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        form button {
            background-color: #2c7a7b;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.1rem;
        }
        form button:hover {
            background-color: #235c5d;
        }
        #search-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #2c7a7b;
            border-radius: 8px;
            font-size: 1rem;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px 8px;
            text-align: center;
            font-size: 1rem;
        }
        th {
            background-color: #e2e8f0;
            color: #2d3748;
            font-weight: bold;
        }
        .book-img {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <header>
        <span class="initiative-tag">مبادرة mado وشباب لتوصيل التعليم للجميع</span>
        <h1>موقع "كتابك صدقة"</h1>
        <p>دليل المقررات الدراسية والكتب والمذكرات المتاحة في السودان</p>
    </header>

    <main>
        <!-- قسم إضافة كتاب / مقرر -->
        <section>
            <h2>إضافة كتاب أو مقرر دراسي جديد</h2>
            <form id="add-book-form">
                <input type="text" id="book-title" placeholder="اسم المقرر / الكتاب / المذكرة" required>
                <input type="text" id="subject" placeholder="المادة (مثلاً: كيمياء، أحياء، رياضيات)" required>
                <input type="text" id="location" placeholder="المنطقة (مثلاً: أم درمان، الخرطوم، بحري)" required>
                <input type="text" id="contact" placeholder="رقم التواصل / التليجرام" required>
                <input type="url" id="image-url" placeholder="رابط صورة غلاف المقرر/الكتاب (اختياري)">
                <button type="submit">إضافة إلى القائمة</button>
            </form>
        </section>

        <!-- قسم البحث والتصفح -->
        <section>
            <h2>البحث والتصفح</h2>
            <input type="text" id="search-input" onkeyup="searchBooks()" placeholder="ابحث باسم الكتاب، المادة، أو المنطقة (مثل: أم درمان)...">
            
            <div class="table-responsive">
                <table id="books-table">
                    <thead>
                        <tr>
                            <th>صورة المقرر</th>
                            <th>اسم الكتاب / المذكرة</th>
                            <th>المادة</th>
                            <th>المنطقة</th>
                            <th>التواصل</th>
                        </tr>
                    </thead>
                    <tbody id="books-list">
                        <!-- عناصر المقررات الدراسية -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const books = [
            { 
                title: "الكيمياء - الشهادة السودانية", 
                subject: "كيمياء", 
                location: "أم درمان", 
                contact: "0912345678",
                image: "https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&w=300&q=80"
            },
            { 
                title: "مذكرة الأحياء وأوراق عمل", 
                subject: "أحياء", 
                location: "الخرطوم", 
                contact: "0987654321",
                image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=300&q=80"
            },
            { 
                title: "الرياضيات المتخصصة", 
                subject: "رياضيات", 
                location: "أم درمان", 
                contact: "0911122334",
                image: "https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=300&q=80"
            }
        ];

        function displayBooks(booksToDisplay) {
            const list = document.getElementById("books-list");
            list.innerHTML = "";
            booksToDisplay.forEach(book => {
                const imgTag = book.image 
                    ? `<img src="${book.image}" class="book-img" alt="صورة المقرر">` 
                    : `<span style="color:#aaa; font-size:0.85rem;">لا توجد صورة</span>`;
                const row = `<tr>
                    <td>${imgTag}</td>
                    <td><strong>${book.title}</strong></td>
                    <td>${book.subject}</td>
                    <td>${book.location}</td>
                    <td>${book.contact}</td>
                </tr>`;
                list.innerHTML += row;
            });
        }

        document.getElementById("add-book-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const title = document.getElementById("book-title").value;
            const subject = document.getElementById("subject").value;
            const location = document.getElementById("location").value;
            const contact = document.getElementById("contact").value;
            const image = document.getElementById("image-url").value;

            books.push({ title, subject, location, contact, image });
            displayBooks(books);

            this.reset();
        });

        function searchBooks() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = books.filter(book => 
                book.title.toLowerCase().includes(query) ||
                book.subject.toLowerCase().includes(query) ||
                book.location.toLowerCase().includes(query)
            );
            displayBooks(filtered);
        }

        displayBooks(books);
    </script>

</body>
</html>
